name: LifeScore Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract LifeScore ZIP
        id: project
        run: |
          mkdir project
          unzip lifescore.zip -d project

          ROOT=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            exit 1
          fi

          VERSION=$(sed -n \
            's/.*gradle-\([0-9][0-9.]*\)-.*\.zip.*/\1/p' \
            "$ROOT/gradle/wrapper/gradle-wrapper.properties")

          if [ -z "$VERSION" ]; then
            echo "Gradle version not found"
            exit 1
          fi

          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeScore-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
